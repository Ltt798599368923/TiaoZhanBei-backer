server:
  port: ${PORT:8080}

spring:
  application:
    name: tiaozhanbei-law-backend
  datasource:
    url: ${JDBC_DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:tiaozhanbei}?sslmode=${PGSSLMODE:require}}
    username: ${DB_USERNAME:${PGUSER:postgres}}
    password: ${DB_PASSWORD:${PGPASSWORD:postgres}}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:sk-8d7758bc0a124eb9a252bd0d48015eb9}
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
    model: ${DEEPSEEK_MODEL:deepseek-chat}

logging:
  level:
    com.tiaozhanbei: INFO
    org.springframework.web: WARN
