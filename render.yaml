services:
  - type: web
    name: tiaozhanbei-law-backend
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths:
        - src/**
        - pom.xml
        - Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: tiaozhanbei-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: tiaozhanbei-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: tiaozhanbei-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: tiaozhanbei-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: tiaozhanbei-db
          property: password
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: WECHAT_LOGIN_ENABLED
        value: false
      - key: WECHAT_APP_ID
        sync: false
      - key: WECHAT_APP_SECRET
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: JPA_DDL
        value: update

databases:
  - name: tiaozhanbei-db
    databaseName: tiaozhanbei
    user: tiaozhanbei
    plan: starter
