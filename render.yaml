services:
  - type: web
    name: tiaozhanbei-law-backend
    env: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    buildFilter:
      paths:
        - src/**
        - pom.xml
        - Dockerfile
    envVars:
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: tiaozhanbei-db
          property: connectionString
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: JPA_DDL
        value: update

databases:
  - name: tiaozhanbei-db
    databaseName: tiaozhanbei
    user: tiaozhanbei
    plan: starter
