server:
  port: ${PORT:8080}

spring:
  application:
    name: tiaozhanbei-law-backend
  datasource:
    url: jdbc:${DATABASE_URL:postgresql://localhost:5432/tiaozhanbei}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:}
    url: ${DEEPSEEK_API_URL:https://api.deepseek.com/v1/chat/completions}
    model: ${DEEPSEEK_MODEL:deepseek-chat}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:./uploads}

logging:
  level:
    com.tiaozhanbei: INFO
    org.springframework.web: WARN
